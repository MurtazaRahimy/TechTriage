server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = / {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location = /version {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files /version.json =404;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
